name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: build / test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Free Pascal (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fpc

      - name: Install Free Pascal (macOS)
        if: runner.os == 'macOS'
        run: brew install fpc

      - name: Install Free Pascal (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install freepascal -y --no-progress
          $fpc = Get-ChildItem C:\tools\freepascal -Recurse -Filter fpc.exe | Select-Object -First 1
          if (-not $fpc) { throw "fpc.exe not found after install" }
          $fpc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # The silent install writes no fpc.cfg, so the FCL package units
          # (fpjson, fphttpclient, ...) are not on the search path.
          $ppu = Get-ChildItem C:\tools\freepascal\units -Recurse -Filter fpjson.ppu | Select-Object -First 1
          if (-not $ppu) { throw "fpjson.ppu not found after install" }
          $units = $ppu.Directory.Parent.FullName -replace '\\', '/'
          "FPCFLAGS=-Fu$units/*" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compiler version
        shell: bash
        run: fpc -iV

      # Compiles units, example and tests with -Sew (warnings are errors),
      # then runs tests/TestHelpers and tests/TestClient (local HTTP mock,
      # no network access needed).
      - name: Build and test
        shell: bash
        run: ./build.sh
